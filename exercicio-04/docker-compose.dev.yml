services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '3000:3000'
        volumes:
            - .:/app:cached
        depends_on:
            - mongodb
        environment:
            MONGO_URI: mongodb://mongodb:27017/blog_posts

    mongodb:
        image: mongo:latest
        container_name: orion_mongo_db_dev
        ports:
            - '27017:27017'
        environment:
            MONGO_INITDB_ROOT_USERNAME: orion_user
            MONGO_INITDB_ROOT_PASSWORD: orion_password
        volumes:
            - dev-db-data:/data/db

volumes:
    dev-db-data: