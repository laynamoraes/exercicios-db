services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: production
        ports:
            - '3000:3000'
        depends_on:
            - mongodb
        environment:
            MONGO_URI: mongodb://mongodb:27017/blog_posts
            NODE_ENV: production

    mongodb:
        image: mongo:latest
        container_name: orion_mongo_db_prod
        environment:
            MONGO_INITDB_ROOT_USERNAME: orion_user
            MONGO_INITDB_ROOT_PASSWORD: orion_password
        volumes:
            - prod-db-data:/data/db

volumes:
    prod-db-data: